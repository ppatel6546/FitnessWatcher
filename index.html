<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitnessWatcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>FitnessWatcher</h1>
        <p>Personal Fitness Tracker</p>
    </header>

    <main>
        <section class="card">
            <h2>Add Workout</h2>

            <form id="workoutForm">
                <label for="exercise">Exercise Name:</label>
                <input type="text" id="exercise" required>

                <label for="sets">Sets:</label>
                <input type="number" id="sets" min="1" required>

                <label for="reps">Reps:</label>
                <input type="number" id="reps" min="1" required>

                <label for="weight">Weight (lbs):</label>
                <input type="number" id="weight" min="0" step="0.5" required>

                <label for="date">Date:</label>
                <input type="date" id="date" required>

                <button type="submit">Save Workout</button>
            </form>
        </section>

        <section class="card">
            <h2>Workout History</h2>

            <p id="emptyMessage">
                No Workouts recorded yet.
            </p>

            <ul id="workoutList"></ul>
        </section>
    </main>

    <footer>
        <p>FitnessWatcher - Personal Fitness Tracker</p>
    </footer>
</body>
</html>
